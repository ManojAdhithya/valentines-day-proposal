<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You ❤️</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Soft Pink Gradient */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* No scrolling allowed */
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10; 
            padding: 10px; /* Prevent edge touching on small phones */
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 77, 109, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%; /* Ensure it fits width */
            margin: auto;
            border: none;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .gif-container img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }

        .btn-custom {
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            font-weight: 600;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* Removes blue box on mobile tap */
        }

        .btn-yes {
            background-color: #ff4d6d;
            color: white;
            border: none;
        }

        .btn-yes:hover {
            background-color: #d63353;
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.4);
        }

        /* The Runaway Button */
        .btn-no {
            background-color: #ffffff;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            z-index: 9999; 
            transition: top 0.1s, left 0.1s; /* Smooth movement */
        }
        
        /* Success Message (Hidden Initially) */
        #success-message {
            display: none;
        }

        .heart {
            position: absolute;
            color: #fff;
            opacity: 0.5;
            animation: float 6s linear infinite;
            font-size: 20px;
            z-index: 0; 
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* --- MOBILE OPTIMIZATIONS --- */
        @media (max-width: 576px) {
            .card {
                padding: 25px; /* Smaller padding on phone */
            }
            h1 {
                font-size: 2rem; /* Smaller text */
            }
            p {
                font-size: 1rem;
            }
            .gif-container img {
                max-width: 180px; /* Smaller image */
            }
            .btn-custom {
                padding: 10px 25px; /* Smaller buttons */
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <div class="card" id="question-card">
            <div class="gif-container">
                <img src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUyam5jcHF3aXg3YmZqdm5vYnA3b2Exb3I0amEyMjkyYXVma3Z1MGg2ZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/pJNCzYKh5AbLXTpnew/giphy.gif" alt="Cute Bear Asking">
            </div>
            
            <h1>Will you be my Valentine?</h1>
            <p>You are the best thing that ever happened to me.</p>
            
            <div class="d-flex justify-content-center align-items-center flex-wrap">
                <button class="btn btn-custom btn-yes" onclick="sheSaidYes()">Yes! ❤️</button>
                <button class="btn btn-custom btn-no" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <div class="card" id="success-message">
            <div class="gif-container">
                <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Bear Kisses">
            </div>
            <h1>YAY! I Love You! ❤️</h1>
            <p>Can't wait to spend forever with you.</p>
        </div>
    </div>

    <script>
        // 1. Mobile-Ready Move Button Logic
        function moveButton() {
            var btn = document.getElementById('noBtn');
            
            // Fixed positioning ensures it doesn't get stuck in the card layout
            btn.style.position = 'fixed'; 

            // Calculate available space
            // On mobile, we reduce the safety margin so it has more places to go
            var margin = 20; 
            var maxWidth = window.innerWidth - btn.offsetWidth - margin;
            var maxHeight = window.innerHeight - btn.offsetHeight - margin;

            // Generate random positions
            var randomX = Math.floor(Math.random() * maxWidth) + (margin / 2);
            var randomY = Math.floor(Math.random() * maxHeight) + (margin / 2);
            
            // Apply new position
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        // 2. Success Logic
        function sheSaidYes() {
            document.getElementById('question-card').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
            createHearts(50);
        }

        // 3. Floating Hearts Background
        function createHearts(count = 20) {
            const container = document.getElementById('hearts-container');
            
            for (let i = 0; i < count; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('heart');
                
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 3 + 4 + 's';
                heart.style.fontSize = Math.random() * 20 + 15 + 'px';
                
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }
        }

        setInterval(() => {
            createHearts(3);
        }, 300);
    </script>
</body>
</html>
